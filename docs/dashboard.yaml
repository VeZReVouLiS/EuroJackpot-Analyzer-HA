# Παράδειγμα dashboard με τις κάρτες του EuroJackpot Analyzer.
# Dashboards -> Προσθήκη dashboard -> (νέο) -> ⋮ -> Raw configuration editor -> επικόλληση.
# Οι κάρτες φορτώνονται αυτόματα από το integration. Προαιρετικά `language: el` ή `en` για σταθερή γλώσσα.
views:
  - title: EuroJackpot Analyzer
    path: eurojackpot
    type: sections
    max_columns: 3
    sections:
      - type: grid
        cards:
          - type: custom:eurojackpot-analyzer-last-draw-card
      - type: grid
        cards:
          - type: custom:eurojackpot-analyzer-stats-card
      - type: grid
        cards:
          - type: custom:eurojackpot-analyzer-ticket-card
            columns: 5
            algorithm: auto_column
